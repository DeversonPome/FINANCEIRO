<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Finanças — Painel Pessoal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F59E0B">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --graphite:#14171B;
  --graphite-2:#1C2026;
  --graphite-3:#242932;
  --graphite-4:#2E343F;
  --line:#333A44;
  --ink:#E8EAED;
  --ink-dim:#9AA2AD;
  --ink-faint:#5C6470;
  --amber:#F59E0B;
  --amber-dim:#B97C0A;
  --green:#22C55E;
  --green-dim:#16803C;
  --red:#EF4444;
  --red-dim:#B91C1C;
  --blue:#3B82F6;
  --purple:#A855F7;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--graphite);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.04em; font-weight:400;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:var(--graphite);}
::-webkit-scrollbar-thumb{background:var(--graphite-4); border-radius:8px;}

/* ===== APP SHELL ===== */
#app{display:flex; min-height:100vh;}

/* ---- Sidebar (desktop) ---- */
.sidebar{
  width:230px; flex-shrink:0;
  background:var(--graphite-2);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:22px 20px 18px 20px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px;
}
.brand-mark{
  width:34px; height:34px; border-radius:8px;
  background:linear-gradient(135deg, var(--amber), var(--amber-dim));
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif; font-size:18px; color:#14171B; flex-shrink:0;
}
.brand-text .display{font-size:20px; line-height:1; color:var(--ink);}
.brand-text span{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em;}

.nav{flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--ink-dim); font-size:13.5px; font-weight:500;
  cursor:pointer; border:1px solid transparent; user-select:none;
  transition:background .15s, color .15s;
}
.nav-item .ic{width:18px; text-align:center; font-size:15px;}
.nav-item:hover{background:var(--graphite-3); color:var(--ink);}
.nav-item.active{background:var(--graphite-3); color:var(--amber); border-color:var(--line);}
.nav-item.active .ic{filter:none;}

.sidebar-foot{
  padding:14px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:8px;
}
.saldo-mini{padding:10px 12px; background:var(--graphite-3); border-radius:var(--radius-sm); border:1px solid var(--line);}
.saldo-mini .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.saldo-mini .val{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; margin-top:2px;}

/* ---- Mobile top bar ---- */
.topbar{display:none;}

/* ---- Main ---- */
.main{flex:1; min-width:0; padding:26px 30px 90px 30px;}
.page{display:none; animation:fadeIn .25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:32px; color:var(--ink);}
.page-head .sub{color:var(--ink-faint); font-size:13px; margin-top:2px;}

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:10px 16px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:600; cursor:pointer;
  border:1px solid var(--line); background:var(--graphite-3); color:var(--ink);
  transition:transform .1s, background .15s, border-color .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--graphite-4);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--amber); color:#14171B; border-color:var(--amber);}
.btn-primary:hover{background:#FFB020;}
.btn-danger{background:transparent; color:var(--red); border-color:var(--red-dim);}
.btn-danger:hover{background:rgba(239,68,68,.1);}
.btn-ghost{background:transparent; border-color:var(--line);}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn-icon{padding:9px; width:36px; height:36px; justify-content:center;}

/* ---- Cards / Grid ---- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:2fr 1fr;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
@media(max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr 1fr;}}

.card{
  background:var(--graphite-2); border:1px solid var(--line);
  border-radius:var(--radius); padding:18px 20px;
}
.card-title{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:600; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}

.kpi .card-title{margin-bottom:8px;}
.kpi .amt{font-family:'JetBrains Mono',monospace; font-size:25px; font-weight:700; line-height:1.1;}
.kpi .delta{font-size:11.5px; margin-top:6px; color:var(--ink-faint); display:flex; align-items:center; gap:4px;}
.kpi.income .amt{color:var(--green);}
.kpi.expense .amt{color:var(--red);}
.kpi.balance .amt{color:var(--amber);}
.up{color:var(--green);} .down{color:var(--red);}

/* ---- Tables / lists ---- */
.tx-row{
  display:grid; grid-template-columns:4px 34px 1fr auto auto; gap:12px; align-items:center;
  padding:11px 8px; border-radius:10px; cursor:pointer;
  border-bottom:1px solid var(--graphite-3);
}
.tx-row:hover{background:var(--graphite-3);}
.tx-row:last-child{border-bottom:none;}
.tx-stripe{width:4px; height:30px; border-radius:3px;}
.tx-ic{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--graphite-3);}
.tx-mid .desc{font-size:13.5px; font-weight:600; color:var(--ink);}
.tx-mid .meta{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.tx-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; text-align:right;}
.tx-val.pos{color:var(--green);}
.tx-val.neg{color:var(--red);}
.tx-status{font-size:10px; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; text-align:center;}
.st-pago{background:rgba(34,197,94,.12); color:var(--green);}
.st-pendente{background:rgba(245,158,11,.12); color:var(--amber);}

.empty{padding:40px 20px; text-align:center; color:var(--ink-faint);}
.empty .ic{font-size:34px; margin-bottom:8px; opacity:.5;}
.empty .t{font-size:14px; font-weight:600; color:var(--ink-dim);}
.empty .s{font-size:12.5px; margin-top:3px;}

/* ---- Progress bars ---- */
.pbar{height:8px; border-radius:6px; background:var(--graphite-4); overflow:hidden; margin-top:8px;}
.pbar-fill{height:100%; border-radius:6px; transition:width .4s ease;}

/* ---- Filters bar ---- */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
select, input[type=text], input[type=search], input[type=number], input[type=date], input[type=month], textarea{
  background:var(--graphite-3); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--radius-sm); padding:9px 12px; font-size:13px; font-family:'Inter',sans-serif;
  outline:none;
}
select:focus, input:focus, textarea:focus{border-color:var(--amber);}
label{font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px;}

/* ---- Modal ---- */
.modal-bg{
  display:none; position:fixed; inset:0; background:rgba(10,12,15,.7);
  backdrop-filter:blur(3px); z-index:100; align-items:flex-start; justify-content:center;
  padding:40px 16px; overflow-y:auto;
}
.modal-bg.active{display:flex;}
.modal{
  background:var(--graphite-2); border:1px solid var(--line); border-radius:var(--radius);
  width:100%; max-width:460px; padding:22px; animation:pop .18s ease;
}
@keyframes pop{from{opacity:0; transform:scale(.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:22px;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
select, input, textarea{width:100%;}
.seg{display:flex; gap:6px; background:var(--graphite-3); padding:4px; border-radius:var(--radius-sm); border:1px solid var(--line);}
.seg button{flex:1; padding:8px; border:none; background:transparent; color:var(--ink-faint); border-radius:6px; font-size:12.5px; font-weight:700; cursor:pointer;}
.seg button.on{background:var(--graphite-4); color:var(--ink);}
.seg button.on.inc{color:var(--green);}
.seg button.on.exp{color:var(--red);}
.color-pick{display:flex; gap:7px; flex-wrap:wrap;}
.color-pick .sw{width:24px; height:24px; border-radius:7px; cursor:pointer; border:2px solid transparent;}
.color-pick .sw.on{border-color:#fff;}
.modal-actions{display:flex; gap:8px; margin-top:18px;}
.modal-actions .btn{flex:1; justify-content:center;}

/* ---- Toast ---- */
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast-item{background:var(--graphite-4); border:1px solid var(--line); padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.4); animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ---- Category chip / goal card ---- */
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
.cat-list-item{display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--graphite-3);}
.cat-list-item:last-child{border:none;}
.cat-dot{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px;}

.goal-card{background:var(--graphite-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
.goal-card .top{display:flex; justify-content:space-between; align-items:flex-start;}
.goal-card h4{font-size:15px; font-weight:700;}
.goal-card .prazo{font-size:11px; color:var(--ink-faint); margin-top:2px;}
.goal-card .nums{display:flex; justify-content:space-between; margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:12.5px;}
.goal-card .nums .a{color:var(--ink); font-weight:700;}
.goal-card .nums .b{color:var(--ink-faint);}

/* ---- Account card ---- */
.acc-card{background:var(--graphite-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; position:relative; overflow:hidden;}
.acc-card::before{content:''; position:absolute; top:0; left:0; width:4px; height:100%;}
.acc-card .tipo{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700;}
.acc-card h4{font-size:16px; margin-top:2px;}
.acc-card .saldo{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; margin-top:12px;}
.acc-card .foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}

/* ---- Recorrentes / bills ---- */
.bill-row{display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid var(--graphite-3);}
.bill-row:last-child{border:none;}
.bill-days{width:44px; height:44px; border-radius:10px; background:var(--graphite-3); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0;}
.bill-days .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; line-height:1;}
.bill-days .l{font-size:8px; text-transform:uppercase; color:var(--ink-faint);}

/* ---- Mobile bottom nav ---- */
.bottom-nav{display:none;}

@media(max-width:900px){
  .sidebar{display:none;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); background:var(--graphite-2);
    position:sticky; top:0; z-index:50;
  }
  .main{padding:18px 16px 90px 16px;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .page-head h1{font-size:26px;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:var(--graphite-2); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px; justify-content:space-around;
  }
  .bn-item{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-faint); font-size:9.5px; font-weight:600; padding:6px 8px; border-radius:10px; cursor:pointer;}
  .bn-item .ic{font-size:18px;}
  .bn-item.active{color:var(--amber);}
  .fab{
    position:fixed; bottom:74px; right:18px; z-index:65;
    width:54px; height:54px; border-radius:50%;
    background:var(--amber); color:#14171B; border:none;
    font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(245,158,11,.4); cursor:pointer;
  }
}
@media(min-width:901px){
  .fab{display:none;}
}

.hidden{display:none !important;}
.charts-row{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
.chart-box{position:relative; height:220px;}
.legend-list{display:flex; flex-direction:column; gap:9px; margin-top:12px;}
.legend-row{display:flex; align-items:center; justify-content:space-between; font-size:12.5px;}
.legend-row .l{display:flex; align-items:center; gap:8px; color:var(--ink-dim);}
.legend-dot{width:9px; height:9px; border-radius:3px;}
.legend-row .v{font-family:'JetBrains Mono',monospace; font-weight:600;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* =========================================================
   FINANÇAS — Painel Pessoal
   Camada de dados (localStorage) + utilitários
   ========================================================= */
const DB_KEY = 'financas_pessoal_v1';

const ICONS = ['🍽️','🚗','🏠','💊','📚','🎮','🛍️','🧾','💰','📈','📌','✈️','🐾','👶','🎁','⚽','☕','🔧','📱','💇','🏋️','🎓','🛠️','⛽'];
const COLORS = ['#F59E0B','#22C55E','#EF4444','#3B82F6','#A855F7','#EC4899','#14B8A6','#F97316','#8B5CF6','#84CC16','#06B6D4','#F43F5E'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultData(){
  const now = new Date();
  const catExpense = [
    {nome:'Alimentação', icone:'🍽️', cor:'#F59E0B'},
    {nome:'Transporte', icone:'🚗', cor:'#3B82F6'},
    {nome:'Moradia', icone:'🏠', cor:'#A855F7'},
    {nome:'Saúde', icone:'💊', cor:'#EF4444'},
    {nome:'Educação', icone:'📚', cor:'#06B6D4'},
    {nome:'Lazer', icone:'🎮', cor:'#EC4899'},
    {nome:'Compras', icone:'🛍️', cor:'#F97316'},
    {nome:'Contas e Serviços', icone:'🧾', cor:'#84CC16'},
    {nome:'Outros', icone:'📌', cor:'#8B5CF6'},
  ].map(c=>({id:uid(), tipo:'despesa', ...c}));
  const catIncome = [
    {nome:'Salário', icone:'💰', cor:'#22C55E'},
    {nome:'Freelance', icone:'💻', cor:'#14B8A6'},
    {nome:'Investimentos', icone:'📈', cor:'#F59E0B'},
    {nome:'Outros', icone:'📌', cor:'#8B5CF6'},
  ].map(c=>({id:uid(), tipo:'receita', ...c}));

  const accCorrente = {id:uid(), nome:'Conta Corrente', tipo:'corrente', saldoInicial:0, cor:'#3B82F6'};
  const accCartao = {id:uid(), nome:'Cartão de Crédito', tipo:'cartao', saldoInicial:0, limite:0, fechamento:1, vencimento:10, cor:'#EF4444'};

  return {
    accounts:[accCorrente, accCartao],
    categories:[...catExpense, ...catIncome],
    transactions:[],
    budgets:[],
    goals:[],
    settings:{ moeda:'BRL' }
  };
}

let DATA = null;

function loadData(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ DATA = JSON.parse(raw); }
    else { DATA = defaultData(); saveData(); }
  }catch(e){ DATA = defaultData(); }
  // migrações leves / garantir campos
  if(!DATA.settings) DATA.settings = {moeda:'BRL'};
  if(!DATA.budgets) DATA.budgets = [];
  if(!DATA.goals) DATA.goals = [];
  return DATA;
}
function saveData(){
  localStorage.setItem(DB_KEY, JSON.stringify(DATA));
}

/* ---------- Formatação ---------- */
function fmtBRL(v){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtMonthLabel(ym){
  const [y,m] = ym.split('-');
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${meses[parseInt(m,10)-1]}/${y.slice(2)}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function currentYM(){ return new Date().toISOString().slice(0,7); }
function ymOf(iso){ return iso.slice(0,7); }

function shiftYM(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

/* ---------- Helpers de consulta ---------- */
function getAccount(id){ return DATA.accounts.find(a=>a.id===id); }
function getCategory(id){ return DATA.categories.find(c=>c.id===id); }

function accountBalance(accId, asOfDate){
  const acc = getAccount(accId);
  if(!acc) return 0;
  let bal = Number(acc.saldoInicial)||0;
  DATA.transactions.forEach(t=>{
    if(t.status==='pendente') return; // pendentes não afetam o saldo até serem marcados como pagos
    if(asOfDate && t.data>asOfDate) return;
    if(t.tipo==='transferencia'){
      if(t.contaOrigemId===accId) bal -= Number(t.valor);
      if(t.contaDestinoId===accId) bal += Number(t.valor);
      return;
    }
    if(t.contaId!==accId) return;
    if(t.tipo==='receita') bal += Number(t.valor);
    else if(t.tipo==='despesa') bal -= Number(t.valor);
  });
  return bal;
}

function totalPatrimonio(asOfDate){
  return DATA.accounts.reduce((s,a)=>s+accountBalance(a.id, asOfDate),0);
}

function lastDayOfMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).toISOString().slice(0,10);
}

function netWorthSeries(numMonths){
  const ym = currentYM();
  const months = [];
  for(let i=numMonths-1;i>=0;i--) months.push(shiftYM(ym,-i));
  return months.map(m=>({ym:m, valor: totalPatrimonio(lastDayOfMonth(m))}));
}

/* Comparativo de categorias mês a mês (top N categorias de despesa no período) */
function categoryComparisonSeries(numMonths, topN){
  const ym = currentYM();
  const months = [];
  for(let i=numMonths-1;i>=0;i--) months.push(shiftYM(ym,-i));
  const totals = {};
  months.forEach(m=>{
    categorySpend(m,'despesa').forEach(c=>{ totals[c.cat.id] = (totals[c.cat.id]||0) + c.total; });
  });
  const topCats = Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,topN||5).map(([id])=>getCategory(id)).filter(Boolean);
  const series = topCats.map(cat=>({
    cat,
    valores: months.map(m=> txInMonth(m).filter(t=>t.tipo==='despesa' && t.categoriaId===cat.id).reduce((s,t)=>s+Number(t.valor),0))
  }));
  return {months, series};
}

/* Gasto por cartão no mês atual */
function cardSpendComparison(ym){
  return DATA.accounts.filter(a=>a.tipo==='cartao').map(a=>({
    conta:a,
    total: txInMonth(ym).filter(t=>t.tipo==='despesa' && t.contaId===a.id).reduce((s,t)=>s+Number(t.valor),0)
  })).sort((a,b)=>b.total-a.total);
}

/* Saldo por conta (não-cartão) */
function accountBalanceComparison(){
  return DATA.accounts.filter(a=>a.tipo!=='cartao').map(a=>({conta:a, saldo:accountBalance(a.id)})).sort((a,b)=>b.saldo-a.saldo);
}

/* "Quanto posso gastar hoje" — baseado no orçamento restante do mês, ou média dos últimos 3 meses se não houver orçamento */
function dailySpendAllowance(){
  const ym = currentYM();
  const orcamentoTotal = DATA.budgets.filter(b=>b.mes===ym).reduce((s,b)=>s+Number(b.valor),0);
  const gastoAteHoje = txInMonth(ym).filter(t=>t.tipo==='despesa' && t.status==='pago').reduce((s,t)=>s+Number(t.valor),0);
  const hoje = new Date();
  const totalDias = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  const diasRestantes = Math.max(1, totalDias - hoje.getDate() + 1);
  if(orcamentoTotal>0){
    const restante = orcamentoTotal - gastoAteHoje;
    return { valor: Math.max(0, restante/diasRestantes), estourado: restante<0, comOrcamento:true, restante };
  }
  // fallback: média dos últimos 3 meses
  const meses = [shiftYM(ym,-1), shiftYM(ym,-2), shiftYM(ym,-3)];
  const media = meses.reduce((s,m)=>s+monthTotals(m).despesas,0)/3;
  const diasNoMes = totalDias;
  return { valor: Math.max(0, (media - gastoAteHoje)/diasRestantes) || media/diasNoMes, estourado:false, comOrcamento:false };
}

function txInMonth(ym){
  return DATA.transactions.filter(t=>ymOf(t.data)===ym);
}
function monthTotals(ym){
  const txs = txInMonth(ym);
  const receitas = txs.filter(t=>t.tipo==='receita').reduce((s,t)=>s+Number(t.valor),0);
  const despesas = txs.filter(t=>t.tipo==='despesa').reduce((s,t)=>s+Number(t.valor),0);
  return {receitas, despesas, saldo:receitas-despesas};
}

function categorySpend(ym, tipo='despesa'){
  const txs = txInMonth(ym).filter(t=>t.tipo===tipo);
  const map = {};
  txs.forEach(t=>{
    map[t.categoriaId] = (map[t.categoriaId]||0) + Number(t.valor);
  });
  return Object.entries(map).map(([catId,total])=>({cat:getCategory(catId), total}))
    .filter(x=>x.cat)
    .sort((a,b)=>b.total-a.total);
}

    if(t.status!=='pendente') return false;
    const d = new Date(t.data+'T00:00:00');
    return d>=today && d<=limit;
  }).sort((a,b)=>a.data.localeCompare(b.data));
}

function applyTxFilters(){
  TX_FILTERS.busca = (document.getElementById('fBusca')?.value||'').toLowerCase();
  TX_FILTERS.mes = document.getElementById('fMes')?.value||'';
  TX_FILTERS.tipo = document.getElementById('fTipo')?.value||'';
  TX_FILTERS.conta = document.getElementById('fConta')?.value||'';
  TX_FILTERS.categoria = document.getElementById('fCategoria')?.value||'';

  let list = [...DATA.transactions];
  if(TX_FILTERS.busca) list = list.filter(t=>t.descricao.toLowerCase().includes(TX_FILTERS.busca));
  if(TX_FILTERS.mes) list = list.filter(t=>ymOf(t.data)===TX_FILTERS.mes);
  if(TX_FILTERS.tipo) list = list.filter(t=>t.tipo===TX_FILTERS.tipo);
  if(TX_FILTERS.conta) list = list.filter(t=>t.contaId===TX_FILTERS.conta || t.contaOrigemId===TX_FILTERS.conta || t.contaDestinoId===TX_FILTERS.conta);
  if(TX_FILTERS.categoria) list = list.filter(t=>t.categoriaId===TX_FILTERS.categoria);
  list.sort((a,b)=> b.data.localeCompare(a.data) || (b.criadoEm||0)-(a.criadoEm||0));

  const wrap = document.getElementById('txListWrap');
  if(!wrap) return;
  if(!list.length){
    wrap.innerHTML = emptyTxHTML();
    return;
  }
  // agrupar por data
  const groups = {};
  list.forEach(t=>{ (groups[t.data] = groups[t.data]||[]).push(t); });
  const dates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  wrap.innerHTML = dates.map(d=>{

function exportCSV(){
  const rows = [['Data','Descrição','Tipo','Categoria','Conta','Status','Valor']];
  [...DATA.transactions].sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>{
    if(t.tipo==='transferencia'){
      const origem = getAccount(t.contaOrigemId)?.nome||'?';
      const destino = getAccount(t.contaDestinoId)?.nome||'?';
      rows.push([fmtDate(t.data), t.descricao||'Transferência', 'transferência', '', `${origem} → ${destino}`, t.status, String(t.valor).replace('.',',')]);
      return;
    }
    rows.push([
      fmtDate(t.data), t.descricao, t.tipo, getCategory(t.categoriaId)?.nome||'', getAccount(t.contaId)?.nome||'', t.status, String(t.valor).replace('.',',')
    ]);
  });
  const csv = rows.map(r=>r.map(f=>`"${String(f).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `transacoes_${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado com sucesso', '⬇');
}

function markPaid(id){
  const t = DATA.transactions.find(x=>x.id===id);
  if(!t) return;
  t.status = 'pago';
  if(t.recorrente){
    // cria próxima ocorrência
    const next = nextOccurrence(t.data, t.frequencia||'mensal');
    const copy = {...t, id:uid(), data:next, status:'pendente', criadoEm:Date.now()};
    DATA.transactions.push(copy);
  }
  saveData();
  toast('Marcado como pago', '✅');
  renderPage(CURRENT_PAGE);
}

function nextOccurrence(dateISO, freq){
  const d = new Date(dateISO+'T00:00:00');
  if(freq==='semanal') d.setDate(d.getDate()+7);
  else if(freq==='anual') d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `financas_backup_${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado', '⬇');
}
function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.accounts || !parsed.categories || !parsed.transactions) throw new Error('formato inválido');
      DATA = parsed;
      if(!DATA.budgets) DATA.budgets=[]; if(!DATA.goals) DATA.goals=[]; if(!DATA.settings) DATA.settings={moeda:'BRL'};
      saveData();
      toast('Backup importado com sucesso', '✅');
      renderPage(CURRENT_PAGE);
      refreshHeaderBalances();
    }catch(err){
      toast('Arquivo inválido', '⚠️');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function resetAllData(){
  if(!confirm('Tem certeza? Todos os dados serão apagados permanentemente.')) return;
  if(!confirm('Última confirmação: apagar TUDO?')) return;
  DATA = defaultData();
  saveData();
  toast('Dados apagados', '🗑');
  renderPage('dashboard');
}

function buildModals(){
  const app = document.getElementById('app');
  const wrap = document.createElement('div');
  wrap.innerHTML = `

  `;
  app.appendChild(wrap.firstElementChild);
  document.getElementById('modalBg').addEventListener('click', e=>{
    if(e.target.id==='modalBg') closeModal();
  });
}
function openModalRaw(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('active');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('active');
}

let TX_EDIT_ID = null;
let TX_TIPO = 'despesa';

function openTxModal(id, asBill){

      <button type="button" class="${TX_TIPO==='receita'?'on inc':''}" onclick="setTxTipo('receita')">+ Receita</button>
    </div>
    <div class="field">
      <label>Descrição</label>
      <input type="text" id="txDesc" placeholder="Ex: Supermercado, Salário..." value="${t?escapeAttr(t.descricao):''}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="txValor" placeholder="0,00" value="${t?t.valor:''}">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="txData" value="${t?t.data:(asBill?'':todayISO())}">
      </div>
    </div>
    <div class="field">
      <label>Categoria</label>
      <select id="txCategoria">${DATA.categories.filter(c=>c.tipo===TX_TIPO).map(c=>`<option value="${c.id}" ${t&&t.categoriaId===c.id?'selected':''}>${c.icone} ${c.nome}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label>Conta</label>
      <select id="txConta">${accOpts}</select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Status</label>
        <select id="txStatus">
          <option value="pago" ${t&&t.status==='pago'?'selected':''}>${TX_TIPO==='receita'?'Recebido':'Pago'}</option>
          <option value="pendente" ${(t&&t.status==='pendente')||asBill?'selected':''}>Pendente</option>
        </select>
      </div>
      <div class="field">
        <label>Recorrente?</label>
        <select id="txRecorrente" onchange="toggleFreqField()">
          <option value="nao" ${!t||!t.recorrente?'selected':''}>Não</option>
          <option value="sim" ${t&&t.recorrente?'selected':''}>Sim</option>
        </select>
      </div>
    </div>
    <div class="field" id="txFreqField" style="${(t&&t.recorrente)?'':'display:none;'}">
      <label>Frequência</label>
      <select id="txFrequencia">
        <option value="mensal" ${!t||t.frequencia==='mensal'?'selected':''}>Mensal</option>
        <option value="semanal" ${t&&t.frequencia==='semanal'?'selected':''}>Semanal</option>
        <option value="anual" ${t&&t.frequencia==='anual'?'selected':''}>Anual</option>
      </select>
    </div>
    <div class="modal-actions">
      ${t? `<button class="btn btn-danger" onclick="deleteTx('${t.id}')">Excluir</button>` : ''}
      <button class="btn btn-primary" onclick="saveTx()">Salvar</button>
    </div>
  `;
  // inject into a temp holder so openTxModal can read innerHTML synchronously
  let holder = document.getElementById('txModalTemplate');
  if(!holder){ holder = document.createElement('div'); holder.id='txModalTemplate'; holder.style.display='none'; document.body.appendChild(holder); }
  holder.innerHTML = html;
}

function setTxTipo(tipo){
  TX_TIPO = tipo;
  const t = TX_EDIT_ID ? DATA.transactions.find(x=>x.id===TX_EDIT_ID) : null;
  renderTxModalBody(t);
  openModalRaw(document.getElementById('txModalTemplate').innerHTML);
}
function toggleFreqField(){
  const v = document.getElementById('txRecorrente').value;
  document.getElementById('txFreqField').style.display = v==='sim' ? '' : 'none';
}

function saveTx(){
  const desc = document.getElementById('txDesc').value.trim();
  const valor = parseFloat(document.getElementById('txValor').value);
  const data = document.getElementById('txData').value;
  const categoriaId = document.getElementById('txCategoria').value;
  const contaId = document.getElementById('txConta').value;
  const status = document.getElementById('txStatus').value;
  const recorrente = document.getElementById('txRecorrente').value==='sim';
  const frequencia = recorrente ? document.getElementById('txFrequencia').value : null;

  if(!desc){ toast('Informe uma descrição','⚠️'); return; }
  if(!valor || valor<=0){ toast('Informe um valor válido','⚠️'); return; }
  if(!data){ toast('Informe a data','⚠️'); return; }
  if(!contaId){ toast('Selecione uma conta','⚠️'); return; }
  if(!categoriaId){ toast('Selecione uma categoria','⚠️'); return; }

  if(TX_EDIT_ID){
    const t = DATA.transactions.find(x=>x.id===TX_EDIT_ID);
    Object.assign(t, {descricao:desc, valor, data, tipo:TX_TIPO, categoriaId, contaId, status, recorrente, frequencia});
    toast('Transação atualizada','✅');
  } else {
    DATA.transactions.push({id:uid(), descricao:desc, valor, data, tipo:TX_TIPO, categoriaId, contaId, status, recorrente, frequencia, criadoEm:Date.now()});
    toast('Transação adicionada','✅');
  }
  saveData();
  closeModal();
  renderPage(CURRENT_PAGE);
}
function deleteTx(id){
  if(!confirm('Excluir esta transação?')) return;
  DATA.transactions = DATA.transactions.filter(t=>t.id!==id);
  saveData();
  closeModal();
  toast('Transação excluída','🗑');
  renderPage(CURRENT_PAGE);
}
function escapeAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

}
function pickColor(el,c){
  el.parentElement.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));

}
function saveAccount(id){
  const nome = document.getElementById('accNome').value.trim();
  const tipo = document.getElementById('accTipo').value;
  const saldoInicial = parseFloat(document.getElementById('accSaldo').value)||0;
  const colorEl = document.querySelector('#accColorPick .sw.on');
  const cor = colorEl ? colorEl.dataset.color : COLORS[0];
  if(!nome){ toast('Informe um nome','⚠️'); return; }
  const payload = {nome, tipo, saldoInicial, cor};
  if(tipo==='cartao'){
    payload.limite = parseFloat(document.getElementById('accLimite').value)||0;
    payload.fechamento = parseInt(document.getElementById('accFechamento').value)||1;
    payload.vencimento = parseInt(document.getElementById('accVencimento').value)||10;
  }
  if(id){
    Object.assign(getAccount(id), payload);
    toast('Conta atualizada','✅');
  } else {
    DATA.accounts.push({id:uid(), ...payload});
    toast('Conta criada','✅');
  }
  saveData();
  closeModal();
  renderPage(CURRENT_PAGE);
}
function deleteAccount(id){
  const hasTx = DATA.transactions.some(t=>t.contaId===id || t.contaOrigemId===id || t.contaDestinoId===id);
  if(hasTx && !confirm('Esta conta possui transações vinculadas. Excluir mesmo assim? As transações continuarão existindo mas sem conta associada.')) return;
  if(!hasTx && !confirm('Excluir esta conta?')) return;
  DATA.accounts = DATA.accounts.filter(a=>a.id!==id);
  saveData();
  closeModal();
  toast('Conta excluída','🗑');
  renderPage(CURRENT_PAGE);
}

      <div class="color-pick">${['🏆','🏠','✈️','🚗','💍','🎓','🩺','🐣','📱','💻'].map(i=>`<div class="sw" style="background:var(--graphite-3); display:flex; align-items:center; justify-content:center; font-size:14px;" onclick="pickIcon(this,'${i}')" data-icon="${i}">${i}</div>`).join('')}</div>
    </div>
    <div class="field">
      <label>Cor</label>
      <div class="color-pick" id="goalColorPick">${COLORS.map(c=>`<div class="sw ${g&&g.cor===c?'on':''}" style="background:${c}" onclick="pickColor(this,'${c}')" data-color="${c}"></div>`).join('')}</div>
    </div>
    <div class="modal-actions">
      ${g?`<button class="btn btn-danger" onclick="deleteGoal('${g.id}')">Excluir</button>`:''}
      <button class="btn btn-primary" onclick="saveGoal('${g?g.id:''}')">Salvar</button>
    </div>
  `;
  openModalRaw(html);
  const iconEls = document.querySelectorAll('[data-icon]');
  if(g){ iconEls.forEach(e=>{ if(e.dataset.icon===g.icone) e.classList.add('on'); }); } else { iconEls[0]?.classList.add('on'); }
  const colorEls = document.querySelectorAll('#goalColorPick .sw');
  if(!g) colorEls[0]?.classList.add('on');
}
function saveGoal(id){
  const nome = document.getElementById('goalNome').value.trim();
  const valorAlvo = parseFloat(document.getElementById('goalAlvo').value);
  const valorAtual = parseFloat(document.getElementById('goalAtual').value)||0;
  const prazo = document.getElementById('goalPrazo').value||null;
  const iconEl = document.querySelector('[data-icon].on');
  const colorEl = document.querySelector('#goalColorPick .sw.on');
  const icone = iconEl?iconEl.dataset.icon:'🏆';
  const cor = colorEl?colorEl.dataset.color:COLORS[0];
  if(!nome){ toast('Informe um nome','⚠️'); return; }
  if(!valorAlvo || valorAlvo<=0){ toast('Informe um valor alvo válido','⚠️'); return; }
  if(id){
    Object.assign(DATA.goals.find(g=>g.id===id), {nome, valorAlvo, valorAtual, prazo, icone, cor});
    toast('Meta atualizada','✅');
  } else {
    DATA.goals.push({id:uid(), nome, valorAlvo, valorAtual, prazo, icone, cor});
    toast('Meta criada','✅');
  }
  saveData();
  closeModal();
  renderPage('metas');
}
function deleteGoal(id){
  if(!confirm('Excluir esta meta?')) return;
  DATA.goals = DATA.goals.filter(g=>g.id!==id);
  saveData();
  closeModal();
  toast('Meta excluída','🗑');
  renderPage('metas');
}
function addGoalContribution(id){
  const v = prompt('Valor do aporte (R$):');
  if(v===null) return;
  const val = parseFloat(v.replace(',','.'));
  if(!val || val<=0){ toast('Valor inválido','⚠️'); return; }
  const g = DATA.goals.find(x=>x.id===id);
  g.valorAtual = Number(g.valorAtual) + val;
  saveData();
  toast(`+ ${fmtBRL(val)} adicionados à meta`,'🏆');
  renderPage('metas');
}



/* =========================================================
   TRANSFERÊNCIA ENTRE CONTAS
   ========================================================= */
function openTransferModal(id){
  const t = id ? DATA.transactions.find(x=>x.id===id) : null;
  if(DATA.accounts.length<2){
    toast('Cadastre pelo menos 2 contas para transferir','⚠️');
    return;
  }
  const accOpts = DATA.accounts.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
  const html = `
    <div class="modal-head"><h3>${t?'Editar transferência':'Transferir entre contas'}</h3><button class="btn btn-icon btn-ghost" onclick="closeModal()">✕</button></div>
    <div class="field">
      <label>Descrição (opcional)</label>
      <input type="text" id="trDesc" placeholder="Ex: Pagamento da fatura" value="${t?escapeAttr(t.descricao||''):''}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>De</label>
        <select id="trOrigem">${accOpts}</select>
      </div>
      <div class="field">
        <label>Para</label>
        <select id="trDestino">${accOpts}</select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="trValor" value="${t?t.valor:''}"></div>
      <div class="field"><label>Data</label><input type="date" id="trData" value="${t?t.data:todayISO()}"></div>
    </div>
    <div class="modal-actions">
      ${t?`<button class="btn btn-danger" onclick="deleteTx('${t.id}')">Excluir</button>`:''}
      <button class="btn btn-primary" onclick="saveTransfer('${t?t.id:''}')">Salvar</button>
    </div>
  `;
  openModalRaw(html);
  if(t){
    document.getElementById('trOrigem').value = t.contaOrigemId;
    document.getElementById('trDestino').value = t.contaDestinoId;
  } else if(DATA.accounts.length>1){
    document.getElementById('trDestino').selectedIndex = 1;
  }
}
function saveTransfer(id){
  const origemId = document.getElementById('trOrigem').value;
  const destinoId = document.getElementById('trDestino').value;
  const valor = parseFloat(document.getElementById('trValor').value);
  const data = document.getElementById('trData').value;
  const descricao = document.getElementById('trDesc').value.trim();
  if(origemId===destinoId){ toast('Escolha contas diferentes','⚠️'); return; }
  if(!valor || valor<=0){ toast('Informe um valor válido','⚠️'); return; }
  if(!data){ toast('Informe a data','⚠️'); return; }
  if(id){
    const t = DATA.transactions.find(x=>x.id===id);
    Object.assign(t, {contaOrigemId:origemId, contaDestinoId:destinoId, valor, data, descricao, tipo:'transferencia', status:'pago'});
    toast('Transferência atualizada','✅');
  } else {
    DATA.transactions.push({id:uid(), tipo:'transferencia', contaOrigemId:origemId, contaDestinoId:destinoId, valor, data, descricao, status:'pago', criadoEm:Date.now()});
    toast('Transferência registrada','✅');
  }
  saveData();
  closeModal();
  renderPage(CURRENT_PAGE);
}

/* =========================================================
   IMPORTAR EXTRATO (CSV)
   ========================================================= */
let IMPORT_ROWS = [];

function openImportModal(){
  const accOpts = DATA.accounts.filter(a=>a.tipo!=='cartao').concat(DATA.accounts.filter(a=>a.tipo==='cartao')).map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
  const html = `
    <div class="modal-head"><h3>Importar extrato</h3><button class="btn btn-icon btn-ghost" onclick="closeModal()">✕</button></div>
    <p style="font-size:12px; color:var(--ink-dim); line-height:1.6; margin-bottom:14px;">
      Envie um arquivo <strong>.csv</strong> exportado do seu banco com colunas de <strong>data</strong>, <strong>descrição</strong> e <strong>valor</strong>.
      Valores negativos viram despesa e positivos viram receita.
    </p>
    <div class="field">
      <label>Arquivo CSV</label>
      <input type="file" accept=".csv,text/csv" id="importFile" onchange="handleImportFile(event)">
    </div>
    <div class="field">
      <label>Importar para a conta</label>
      <select id="importConta">${accOpts}</select>
    </div>
    <div id="importPreviewWrap"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="importConfirmBtn" onclick="confirmImport()" disabled>Importar</button>
    </div>
  `;
  openModalRaw(html);
  IMPORT_ROWS = [];
}

function parseCSV(text){
  // detecta delimitador (; ou ,)
  const firstLine = text.split(/\r?\n/)[0]||'';
  const delim = (firstLine.match(/;/g)||[]).length >= (firstLine.match(/,/g)||[]).length ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const parseLine = line => {
    const out = []; let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){ inQuotes = !inQuotes; continue; }
      if(ch===delim && !inQuotes){ out.push(cur); cur=''; continue; }
      cur += ch;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const rows = lines.map(parseLine);
  return rows;
}

function guessColumns(header){
  const norm = header.map(h=>h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  const find = (...keys) => norm.findIndex(h=>keys.some(k=>h.includes(k)));
  return {
    data: find('data','date'),
    desc: find('descr','histor','memo','titulo'),
    valor: find('valor','amount','montante')
  };
}

function parseValorBR(raw){
  if(raw==null) return NaN;
  let s = String(raw).trim().replace(/[R$\s]/g,'');
  // se tem vírgula como separador decimal
  if(s.includes(',') && s.includes('.')){
    s = s.replace(/\./g,'').replace(',','.');
  } else if(s.includes(',')){
    s = s.replace(',','.');
  }
  return parseFloat(s);
}
function parseDataBR(raw){
  if(!raw) return null;
  const s = raw.trim();
  // já ISO
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // dd/mm/aaaa ou dd-mm-aaaa
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}

function handleImportFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const rows = parseCSV(text);
    if(rows.length<2){ toast('Arquivo vazio ou inválido','⚠️'); return; }
    const header = rows[0];
    const cols = guessColumns(header);
    if(cols.data<0 || cols.desc<0 || cols.valor<0){
      document.getElementById('importPreviewWrap').innerHTML = `<div class="empty"><div class="ic">⚠️</div><div class="t">Não consegui identificar as colunas</div><div class="s">Verifique se o CSV tem colunas de data, descrição e valor</div></div>`;
      return;
    }
    const parsed = rows.slice(1).map(r=>{
      const data = parseDataBR(r[cols.data]);
      const desc = r[cols.desc]||'(sem descrição)';
      const valor = parseValorBR(r[cols.valor]);
      return {data, desc, valor};
    }).filter(r=>r.data && !isNaN(r.valor) && r.valor!==0);

    IMPORT_ROWS = parsed;
    renderImportPreview();
  };
  reader.readAsText(file, 'ISO-8859-1');
}

function renderImportPreview(){
  const wrap = document.getElementById('importPreviewWrap');
  const btn = document.getElementById('importConfirmBtn');
  if(!IMPORT_ROWS.length){
    wrap.innerHTML = `<div class="empty"><div class="ic">📭</div><div class="t">Nenhum lançamento reconhecido</div></div>`;
    btn.disabled = true;
    return;
  }
  const receitas = IMPORT_ROWS.filter(r=>r.valor>0).length;
  const despesas = IMPORT_ROWS.filter(r=>r.valor<0).length;
  wrap.innerHTML = `
    <div class="card" style="background:var(--graphite-3); margin:10px 0;">
      <div style="font-size:12.5px; color:var(--ink-dim); margin-bottom:8px;"><strong>${IMPORT_ROWS.length}</strong> lançamentos encontrados — ${receitas} receita(s), ${despesas} despesa(s)</div>
      <div style="max-height:220px; overflow-y:auto;">
        ${IMPORT_ROWS.slice(0,50).map(r=>`
          <div style="display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid var(--graphite-4); font-size:11.5px;">
            <span style="color:var(--ink-faint); flex-shrink:0;">${fmtDate(r.data)}</span>
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHTML(r.desc)}</span>
            <span style="font-family:'JetBrains Mono',monospace; color:${r.valor>=0?'var(--green)':'var(--red)'}; flex-shrink:0;">${fmtBRL(r.valor)}</span>
          </div>
        `).join('')}
      </div>
      ${IMPORT_ROWS.length>50?`<div style="font-size:11px; color:var(--ink-faint); margin-top:6px;">mostrando 50 de ${IMPORT_ROWS.length}</div>`:''}
    </div>
  `;
  btn.disabled = false;
}

function confirmImport(){
  const contaId = document.getElementById('importConta').value;
  if(!contaId || !IMPORT_ROWS.length) return;
  const catDespesaPadrao = DATA.categories.find(c=>c.tipo==='despesa' && c.nome==='Outros') || DATA.categories.find(c=>c.tipo==='despesa');
  const catReceitaPadrao = DATA.categories.find(c=>c.tipo==='receita' && c.nome==='Outros') || DATA.categories.find(c=>c.tipo==='receita');
  let count = 0;
  IMPORT_ROWS.forEach(r=>{
    const isIncome = r.valor>0;
    DATA.transactions.push({
      id: uid(), descricao: r.desc, valor: Math.abs(r.valor), data: r.data,
      tipo: isIncome?'receita':'despesa',
      categoriaId: isIncome ? (catReceitaPadrao?catReceitaPadrao.id:'') : (catDespesaPadrao?catDespesaPadrao.id:''),
      contaId, status:'pago', recorrente:false, frequencia:null, criadoEm:Date.now()
    });
    count++;
  });
  saveData();
  closeModal();
  toast(`${count} lançamentos importados`,'✅');
  renderPage(CURRENT_PAGE);
}



/* =========================================================
   PWA — Service Worker + prompt de instalação
   ========================================================= */
let DEFERRED_INSTALL_PROMPT = null;

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* silencioso: funciona normalmente sem SW */ });
  });
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
  const btn = document.getElementById('pwaInstallBtn');
  if(btn) btn.style.display = '';
});

function triggerInstallPrompt(){
  if(!DEFERRED_INSTALL_PROMPT){
    toast('Use o menu do navegador → "Adicionar à tela inicial"','📲');
    return;
  }
  DEFERRED_INSTALL_PROMPT.prompt();
  DEFERRED_INSTALL_PROMPT.userChoice.finally(()=>{ DEFERRED_INSTALL_PROMPT = null; });
}
